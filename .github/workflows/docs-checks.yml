name: docs-checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  docs-checks:
    runs-on: ubuntu-latest
    env:
      KDG_BANNED_TERMS: ${{ secrets.KDG_BANNED_TERMS }}
    steps:
      - name: Mask term list
        run: |
          python3 -c 'import os, sys
          raw = os.environ.get("KDG_BANNED_TERMS") or ""
          for line in raw.splitlines():
              term = line.strip()
              if not term:
                  continue
              sys.stdout.write("::add-mask::%s\n" % term)
              if term.startswith("short:"):
                  root = term.split(":", 1)[1].strip()
                  if root:
                      sys.stdout.write("::add-mask::%s\n" % root)
          '
      - name: Checkout
        uses: actions/checkout@v4.4.0
      - name: Setup Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"
      - name: Self-test the checker
        run: python3 scripts/check_customer_samples.py --self-test
      - name: Check vendored spec digest
        run: python3 scripts/check_customer_samples.py --check-digest
      - name: Check customer samples
        run: python3 scripts/check_customer_samples.py
      - name: Prove banned-term secret
        if: always()
        run: python3 scripts/check_customer_samples.py --prove-secret
